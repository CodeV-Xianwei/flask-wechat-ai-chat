<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #EDEDED;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航 */
        .wx-header {
            height: 48px;
            background-color: #F7F7F7;
            border-bottom: 1px solid #D8D8D8;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .wx-header .title {
            font-size: 17px;
            font-weight: 500;
            color: #000;
        }

        .wx-header #clearBtn {
            position: absolute;
            right: 16px;
            border: none;
            background: transparent;
            color: #07C160;
            font-size: 15px;
            cursor: pointer;
        }

        /* 聊天区域 */
        #chatBox {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            padding-bottom: 90px; /* 给底部输入区留出空间 */
        }

        .msg-item {
            display: flex;
            margin-bottom: 18px;
        }

        .msg-left {
            flex-direction: row;
        }

        .msg-left .avatar {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: #07C160;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .msg-left .bubble {
            background: #ffffff;
            border-radius: 0 12px 12px 12px;
            padding: 11px 15px;
            max-width: 70%;
            position: relative;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
            line-height: 1.5;
        }

        .msg-right {
            flex-direction: row-reverse;
        }

        .msg-right .avatar {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: #409EFF;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .msg-right .bubble {
            background: #95EC69;
            border-radius: 12px 0 12px 12px;
            padding: 11px 15px;
            max-width: 70%;
            position: relative;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
            line-height: 1.5;
        }

        /* 底部输入区，固定在底部 */
        .input-wrap {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #F7F7F7;
            border-top: 1px solid #D8D8D8;
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
        }

        #inputText {
            flex: 1;
            border: 1px solid #D8D8D8;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 16px;
            outline: none;
            background: #fff;
            height: 44px;
            line-height: 20px;
        }

        #inputText:focus {
            border-color: #07C160;
        }

        #sendBtn {
            background: #07C160;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 18px;
            height: 44px;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
        }

        #sendBtn:active {
            background: #06ad56;
        }

        /* 思考动画 */
        .thinking {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #666;
            font-size: 14px;
        }

        .thinking .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #999;
            animation: thinkingDot 1.2s infinite ease-in-out both;
        }

        .thinking .dot:nth-child(1) {
            animation-delay: 0s;
        }

        .thinking .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes thinkingDot {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="wx-header">
        <div class="title">AI助手</div>
        <button id="clearBtn">清空</button>
    </div>

    <div id="chatBox"></div>

    <div class="input-wrap">
        <input type="text" id="inputText" placeholder="输入消息..." />
        <button id="sendBtn">发送</button>
    </div>

<script>
    const chatBox = document.getElementById("chatBox");
    const inputText = document.getElementById("inputText");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    function addUserMsg(text) {
        const wrap = document.createElement("div");
        wrap.className = "msg-item msg-right";
        wrap.innerHTML = `
            <div class="avatar">我</div>
            <div class="bubble"></div>
        `;
        wrap.querySelector(".bubble").textContent = text;
        chatBox.appendChild(wrap);
        scrollBottom();
    }

    function createAiMsg() {
        const wrap = document.createElement("div");
        wrap.className = "msg-item msg-left";
        const bubble = document.createElement("div");
        bubble.className = "bubble";

        wrap.innerHTML = `<div class="avatar">AI</div>`;
        wrap.appendChild(bubble);
        chatBox.appendChild(wrap);
        scrollBottom();
        return bubble;
    }

    function showThinking(bubble) {
        bubble.innerHTML = `
            <span class="thinking">
                AI 思考
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
        `;
    }

    function scrollBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendChat() {
        const msg = inputText.value.trim();
        if (!msg) return;

        addUserMsg(msg);
        inputText.value = "";

        const aiBubble = createAiMsg();
        showThinking(aiBubble);

        try {
            const res = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: msg })
            });

            if (!res.ok || !res.body) {
                aiBubble.textContent = "【错误】请求失败，请稍后重试";
                return;
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                fullText += chunk;

                if (fullText.trim()) {
                    aiBubble.innerText = fullText;
                }

                scrollBottom();
            }
        } catch (err) {
            aiBubble.textContent = "【错误】网络异常：" + err.message;
        }
    }

    sendBtn.onclick = sendChat;

    inputText.onkeydown = e => {
        if (e.key === "Enter") sendChat();
    };

    clearBtn.onclick = () => {
        chatBox.innerHTML = "";
    };
</script>
</body>
</html>
